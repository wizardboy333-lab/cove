# Cove local stack stub — optional. Uncomment/adjust when ready.
# Usage: docker compose up

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cove
      POSTGRES_PASSWORD: cove
      POSTGRES_DB: cove
    ports:
      - "5432:5432"
    volumes:
      - cove_pg:/var/lib/postgresql/data

