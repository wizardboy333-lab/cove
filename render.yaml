# Cove — Render Blueprint (free tier)
# Import from GitHub after Grok Bot pushes the repo.
# Free Postgres: 1 per workspace, 1 GB, expires after 30 days.
# Free web services spin down after ~15 min idle (cold start).
#
# NEXT_PUBLIC_API_URL is baked at Docker build time. Default assumes service
# name cove-api → https://cove-api-7hwg.onrender.com. If Render adds a random
# suffix, set NEXT_PUBLIC_API_URL in the cove-web dashboard (or rebuild with
# the real URL) — see docs/RENDER.md.

databases:
  - name: cove-db
    plan: free

services:
  - type: web
    name: cove-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cove-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: REQUIRE_INVITE
        value: "false"
      - key: JURISDICTION
        value: US
      - key: LOCALE
        value: en-US

  - type: web
    name: cove-web
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    plan: free
    envVars:
      # Browser calls API directly (CORS_ORIGINS=*). Update if hostname differs.
      - key: NEXT_PUBLIC_API_URL
        value: https://cove-api-7hwg.onrender.com
